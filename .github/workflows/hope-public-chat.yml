name: Hope public chat and speech safety regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'hope-conversation-v1.js'
      - 'hope-voice-v1.js'
      - 'tests/hope-conversation-safety.test.mjs'
      - '.github/workflows/hope-public-chat.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'hope-conversation-v1.js'
      - 'hope-voice-v1.js'
      - 'tests/hope-conversation-safety.test.mjs'
permissions:
  contents: read
jobs:
  safety-and-conversation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/hope-conversation-safety.test.mjs
